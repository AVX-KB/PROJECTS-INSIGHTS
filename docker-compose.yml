# Projects Insights (AVX-AI-PROJECTS-INSIGHTS)
# ============================================
# Grafieken over een GitHub Project-bord. Zet elke dag een momentopname van het
# bord in de eigen database op AVX-AI-DB en toont daar de vragen uit.
#
# Starten:   docker compose up -d --build
# Logs:      docker compose logs -f
# Stoppen:   docker compose down
# Na een wijziging in .env:  docker compose up -d --force-recreate
#
# Instellingen en secrets staan in .env naast dit bestand (zie .env.example).
# Wiki: /solutions/projects-insights/overzicht

name: avx-ai-projects-insights

services:
  app:
    build:
      context: ./app
    container_name: AVX-AI-PROJECTS-INSIGHTS
    hostname: avx-ai-projects-insights
    restart: unless-stopped
    init: true        # geeft het stopsignaal door aan Python
    environment:
      POORT: 8080
      # Database: binnen Docker de containernaam en de interne poort.
      DB_HOST: avx-ai-db
      DB_POORT: 5432
      DB_NAAM: AVX-AI-DB-PROJECTS-INSIGHTS
      DB_GEBRUIKER: svc_projects_insights
      DB_WACHTWOORD: ${DB_WACHTWOORD}
      # Eén gedeeld wachtwoord voor de pagina
      TOEGANGSWACHTWOORD: ${TOEGANGSWACHTWOORD}
      # Het bord
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG}
      GITHUB_PROJECT: ${GITHUB_PROJECT}
      SPRINT_VELD: ${SPRINT_VELD:-WEEK}
      STATUS_VELD: ${STATUS_VELD:-Status}
      PRIO_VELD: ${PRIO_VELD:-Priority}
      AFGEROND_STATUSSEN: ${AFGEROND_STATUSSEN:-Done}
      SNAPSHOT_TIJDEN: ${SNAPSHOT_TIJDEN:-06:00,12:00,18:00}
      TIJDZONE: Europe/Amsterdam
      TZ: Europe/Amsterdam
      PYTHONUNBUFFERED: 1
    # Terugvaloptie tot insights.ai-dev.cops.ota werkt; daarna weg
    # (runbook "dienst achter de proxy zetten", stap 6).
    ports:
      - "4002:8080"   # vastgelegd op /infra/naamgeving-en-poorten
    networks:
      - avx-ai-net    # naar de database
      - proxy-net     # bereikbaar voor de proxy: insights.ai-dev.cops.ota -> AVX-AI-PROJECTS-INSIGHTS:8080

networks:
  avx-ai-net:
    external: true
    name: avx-ai-net
  proxy-net:
    external: true
    name: proxy-net
